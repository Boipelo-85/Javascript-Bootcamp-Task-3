<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Portal</title>
</head>
<body>
  <table border="1" cellpadding="15" cellspacing="0" width="600" align="center">
    <tr>
      <td align="center">
        <h1>Signup Portal</h1>
      </td>
    </tr>
    <tr>
      <td>
        <form id="signup-form" novalidate>
          <table border="0" width="100%">
            <tr>
              <td>
                <label for="username"><b>Username</b></label>
              </td>
            </tr>
            <tr>
              <td>
                <input type="text" id="username" name="username" placeholder="Enter your username" />
              </td>
            </tr>
            <tr>
              <td>
                <span class="error" id="username-error"></span>
              </td>
            </tr>

            <tr>
              <td>
                <label for="email"><b>Email</b></label>
              </td>
            </tr>
            <tr>
              <td>
                <input type="email" id="email" name="email" placeholder="Enter your email" />
              </td>
            </tr>
            <tr>
              <td>
                <span class="error" id="email-error"></span>
              </td>
            </tr>

            <tr>
              <td>
                <label for="password"><b>Password</b></label>
              </td>
            </tr>
            <tr>
              <td>
                <input type="password" id="password" name="password" placeholder="Enter your password" />
              </td>
            </tr>
            <tr>
              <td>
                <span class="error" id="password-error"></span>
              </td>
            </tr>

            <tr>
              <td>
                <input type="checkbox" id="terms" name="terms" />
                <label for="terms">I agree to the terms and conditions</label>
              </td>
            </tr>
            <tr>
              <td>
                <span class="error" id="terms-error"></span>
              </td>
            </tr>

            <tr>
              <td>
                <button type="submit">Sign Up</button>
              </td>
            </tr>
            <tr>
              <td>
                <button id="resend-button" type="button" disabled>Resend Verification (10s)</button>
              </td>
            </tr>
          </table>
        </form>
      </td>
    </tr>
  </table>

  <br /><br />
  <br /><br />


  <script src="validation.js"></script>
  <script src="async.js"></script>
</body>
</html>
