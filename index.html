<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Signup Portal</h1>
    <section class="form-wrapper">
      <form id="signup-form" novalidate>
        <div class="field-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" />
          <span class="error" id="username-error"></span>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" />
          <span class="error" id="email-error"></span>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" />
          <span class="error" id="password-error"></span>
        </div>

        <div class="field-group checkbox-group">
          <input type="checkbox" id="terms" name="terms" />
          <label for="terms">I agree to the terms and conditions</label>
          <span class="error" id="terms-error"></span>
        </div>

        <button type="submit" class="primary-btn">Sign Up</button>
        <button id="resend-button" type="button" disabled>Resend Verification (10s)</button>
      </form>
    </section>

    <section class="output-section">
      <h2>Synchronous Output</h2>
      <div id="sync-output" class="output-box"></div>
    </section>

    <section class="output-section">
      <h2>Database Output</h2>
      <div id="db-output" class="output-box"></div>
    </section>
  </main>

  <script src="validation.js"></script>
  <script src="async.js"></script>
</body>
</html>
